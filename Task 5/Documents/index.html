<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday Gayatri 🎂</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: linear-gradient(135deg, #ff758c, #ff7eb3, #8e2de2);
      color: white;
    }

    .container {
      width: 92%;
      max-width: 500px;
      text-align: center;
      padding: 35px 22px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
      animation: appear 1.2s ease;
      z-index: 2;
    }

    .cake {
      font-size: 75px;
      animation: bounce 1.5s infinite;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(35px, 9vw, 60px);
      margin-bottom: 10px;
      text-shadow: 0 0 15px rgba(255,255,255,0.8);
    }

    .name {
      font-size: clamp(28px, 8vw, 42px);
      font-weight: bold;
      color: #fff5a5;
      margin-bottom: 20px;
      text-shadow: 0 0 12px rgba(255,245,165,0.7);
    }

    .message {
      font-size: clamp(16px, 4.5vw, 20px);
      line-height: 1.6;
      margin-bottom: 25px;
    }

    button {
      border: none;
      padding: 14px 28px;
      border-radius: 30px;
      background: white;
      color: #e84393;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    button:hover {
      transform: scale(1.08);
    }

    button:active {
      transform: scale(0.95);
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -20px;
      z-index: 10;
      animation: fall linear forwards;
      pointer-events: none;
    }

    .heart {
      position: fixed;
      bottom: -30px;
      font-size: 20px;
      animation: floatHeart linear forwards;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes fall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    @keyframes floatHeart {
      0% {
        transform: translateY(0) scale(0.8);
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      100% {
        transform: translateY(-110vh) scale(1.5);
        opacity: 0;
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-15px);
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(0.7);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 18px;
      }

      .cake {
        font-size: 65px;
      }

      button {
        width: 90%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="cake">🎂</div>

    <h1>Happy Birthday!</h1>

    <div class="name">
      Dear Gayatri ❤️
    </div>

    <p class="message">
      Wishing you a very Happy Birthday, Gayatri! 🎉💖
      <br><br>

      May your special day be filled with
      happiness, laughter, love and beautiful memories. ✨
      <br><br>

      May all your dreams come true and may
      your year ahead be full of success and joy! 🌸🎂
    </p>

    <button onclick="celebrate()">
      🎉 Celebrate Again
    </button>

  </div>


  <script>

    function createConfetti() {

      const colors = [
        "#ff3838",
        "#ffdd59",
        "#32ff7e",
        "#18dcff",
        "#7d5fff",
        "#ff9ff3",
        "#ffffff"
      ];

      for (let i = 0; i < 120; i++) {

        const confetti = document.createElement("div");

        confetti.className = "confetti";

        confetti.style.left =
          Math.random() * 100 + "vw";

        confetti.style.backgroundColor =
          colors[Math.floor(Math.random() * colors.length)];

        confetti.style.width =
          (5 + Math.random() * 8) + "px";

        confetti.style.height =
          (5 + Math.random() * 12) + "px";

        confetti.style.borderRadius =
          Math.random() > 0.5 ? "50%" : "2px";

        confetti.style.animationDuration =
          (2 + Math.random() * 4) + "s";

        confetti.style.animationDelay =
          Math.random() * 1.5 + "s";

        document.body.appendChild(confetti);

        setTimeout(() => {
          confetti.remove();
        }, 6000);
      }
    }


    function createHearts() {

      const hearts = ["❤️", "💖", "💕", "💗", "💓"];

      for (let i = 0; i < 20; i++) {

        const heart = document.createElement("div");

        heart.className = "heart";

        heart.innerHTML =
          hearts[Math.floor(Math.random() * hearts.length)];

        heart.style.left =
          Math.random() * 100 + "vw";

        heart.style.animationDuration =
          (4 + Math.random() * 4) + "s";

        heart.style.animationDelay =
          Math.random() * 3 + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 8000);
      }
    }


    function celebrate() {
      createConfetti();
      createHearts();
    }


    // Start automatically
    window.onload = function() {
      createConfetti();
      createHearts();
    };

  </script>

</body>
</html>
